<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>7-BITS | Comensales</title>
</head>
<body>
    <h1>Comedor</h1>
    <hr>
    <h3>Registro de Comensal</h3>
    <label>Nombre:</label> <input type="text" id="v_nombre"><br><br>
    <label>Apellido:</label> <input type="text" id="v_apellido"><br><br>
    <label>Cédula:</label> <input type="text" id="v_cedula"><br><br>
    <label>Sexo:</label>
    <select id="v_sexo">
        <option value="F">Femenino</option>
        <option value="M">Masculino</option>
    </select><br><br>
    <label>Fecha Nacimiento:</label> <input type="date" id="v_fecha"><br><br>
    <label>Turno:</label>
    <select id="v_turno">
        <option value="1">Desayuno ($5)</option>
        <option value="2">Almuerzo ($7)</option>
        <option value="3">Ambos ($10)</option>
    </select><br><br>
    <button id="v_btnProcesar">Procesar</button>
    <hr>
    <div id="v_reporte"></div>
    <hr>
    <table border="1">
        <thead>
            <tr>
                <th>Cédula</th>
                <th>Comensal</th>
                <th>Edad</th>
                <th>Monto</th>
            </tr>
        </thead>
        <tbody id="v_tabla"></tbody>
    </table>
    <script type="module" src="./dist/controllers/Cl_controlador.js"></script>
</body>
</html>
