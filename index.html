<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>7-BITS | Concurso</title>
</head>
<body>
    <h1>CONCURSO</h1>
    <hr>
    <label>Nombre:</label> <input type="text" id="v_nombre"><br><br>
    <label>Apellido:</label> <input type="text" id="v_apellido"><br><br>
    <label>Cédula:</label> <input type="text" id="v_cedula"><br><br>
    <label>Sexo:</label> 
    <select id="v_sexo">
        <option value="F">Femenino</option>
        <option value="M">Masculino</option>
    </select><br><br>
    <label>Fecha Nac.:</label> <input type="date" id="v_fecha"><br><br>
    <label>Índice (0-25):</label> <input type="number" id="v_indice"><br><br>
    <label>Preparador (0-15):</label> <input type="number" id="v_preparador"><br><br>
    <label>Diplomas (0-10):</label> <input type="number" id="v_diplomas"><br><br>
    <button id="v_btnProcesar">Evaluar Aspirante</button>
    <hr>
    <div id="v_reporte"></div>
    <hr>
    <table border="1">
        <thead>
            <tr>
                <th>Cédula</th>
                <th>Aspirante</th>
                <th>Sexo</th>
                <th>Fecha Nac.</th>
                <th>Edad</th>
                <th>Puntaje (/30)</th>
            </tr>
        </thead>
        <tbody id="v_tabla"></tbody>
    </table>
    <script type="module" src="./dist/controllers/Cl_controlador.js"></script>
</body>
</html>
