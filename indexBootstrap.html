<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>7-BITS | Concurso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container bg-white p-4 border shadow-sm">
        <h2 class="text-center mb-4">CONCURSO</h2>
        <div class="row">
            <div class="col-md-4 border-end">
                <h5 class="mb-3">Registro de Aspirante</h5>
                <div class="mb-2">
                    <input type="text" id="v_nombre" class="form-control" placeholder="Nombre">
                </div>
                <div class="mb-2">
                    <input type="text" id="v_apellido" class="form-control" placeholder="Apellido">
                </div>
                <div class="mb-2">
                    <input type="text" id="v_cedula" class="form-control" placeholder="Cédula">
                </div>
                <div class="mb-2">
                    <select id="v_sexo" class="form-select">
                        <option value="F">Femenino</option>
                        <option value="M">Masculino</option>
                    </select>
                </div>
                <div class="mb-2">
                    <label class="form-label small">Fecha de Nacimiento:</label>
                    <input type="date" id="v_fecha" class="form-control">
                </div>
                <div class="mb-2">
                    <input type="number" id="v_indice" class="form-control" placeholder="Puntos Índice (0-25)">
                </div>
                <div class="mb-2">
                    <input type="number" id="v_preparador" class="form-control" placeholder="Puntos Prep (0-15)">
                </div>
                <div class="mb-3">
                    <input type="number" id="v_diplomas" class="form-control" placeholder="Puntos Diplomas (0-10)">
                </div>
                <button id="v_btnProcesar" class="btn btn-primary w-100">Evaluar y Registrar</button>
            </div>
            <div class="col-md-8">
                <div id="v_reporte" class="alert alert-success fw-bold text-center">Esperando datos...</div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Cédula</th>
                                <th>Nombre Completo</th>
                                <th>Sexo</th>
                                <th>Nacimiento</th>
                                <th>Edad</th>
                                <th>Puntaje</th>
                            </tr>
                        </thead>
                        <tbody id="v_tabla"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="./dist/controllers/Cl_controlador.js"></script>
</body>
</html>
