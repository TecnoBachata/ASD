<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>7-BITS | Comensales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container bg-white p-4 border shadow-sm">
        <h2 class="text-center">Comedor</h2>
        <div class="row mt-4">
            <div class="col-md-4 border-end">
                <h5>Nuevo Comensal</h5>
                <input type="text" id="v_nombre" class="form-control mb-2" placeholder="Nombre">
                <input type="text" id="v_apellido" class="form-control mb-2" placeholder="Apellido">
                <input type="text" id="v_cedula" class="form-control mb-2" placeholder="Cédula">
                <select id="v_sexo" class="form-select mb-2">
                    <option value="F">Femenino</option>
                    <option value="M">Masculino</option>
                </select>
                <input type="date" id="v_fecha" class="form-control mb-2">
                <select id="v_turno" class="form-select mb-3">
                    <option value="1">Desayuno</option>
                    <option value="2">Almuerzo</option>
                    <option value="3">Ambos</option>
                </select>
                <button id="v_btnProcesar" class="btn btn-primary w-100">Registrar</button>
            </div>
            <div class="col-md-8 text-center">
                <div id="v_reporte" class="alert alert-secondary py-2 mb-3">Esperando datos...</div>
                <table class="table table-striped table-sm">
                    <thead><tr><th>Cédula</th><th>Nombre</th><th>Edad</th><th>Monto</th></tr></thead>
                    <tbody id="v_tabla"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script type="module" src="./dist/controllers/Cl_controlador.js"></script>
</body>
</html>
